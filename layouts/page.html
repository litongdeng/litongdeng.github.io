<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .Title }} | {{ .Site.Title }}</title>
    <link rel="stylesheet" href="/css/main.css">
  </head>

  <body>
    {{ partial "header.html" . }}

    <main class="content-page">
      <h1>{{ .Title }}</h1>

      <div class="page-body">
        {{ .Content }}
      </div>
    </main>

    {{ partial "footer.html" . }}
  </body>
</html>
